apiVersion: v1
kind: Namespace
metadata:
  name: petite-maison
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: petite-maison-backend
  namespace: petite-maison
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: petite-maison-frontend
  namespace: petite-maison
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: petite-maison-backend-config
  namespace: petite-maison
data:
  PORT: "3000"
  API_VERSION: "v1"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  # Optional: keep default CORS_ORIGIN from code; same-origin ingress means CORS usually won't matter.
  # CORS_ORIGIN: "http://localhost"
  UPLOAD_MAX_FILE_SIZE_MB: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: petite-maison-backend-secret
  namespace: petite-maison
type: Opaque
stringData:
  JWT_SECRET: "dev_jwt_secret_change_me"
  JWT_REFRESH_SECRET: "dev_jwt_refresh_secret_change_me"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  BCRYPT_ROUNDS: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petite-maison-backend
  namespace: petite-maison
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petite-maison-backend
  template:
    metadata:
      labels:
        app: petite-maison-backend
    spec:
      serviceAccountName: petite-maison-backend
      volumes:
        - name: data
          emptyDir: {}
      initContainers:
        - name: migrate-seed
          image: petite-maison-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: petite-maison-backend-config
            - secretRef:
                name: petite-maison-backend-secret
          env:
            - name: DATABASE_URL
              value: "file:/data/dev.db"
            - name: UPLOAD_DIR
              value: "/data/uploads"
          volumeMounts:
            - name: data
              mountPath: /data
          command: ["sh", "-c"]
          args:
            - |
              set -e
              echo "[init] prisma generate"
              npm run prisma:generate
              echo "[init] prisma migrate deploy"
              npx prisma migrate deploy
              echo "[init] prisma seed"
              npm run prisma:seed
      containers:
        - name: backend
          image: petite-maison-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: petite-maison-backend-config
            - secretRef:
                name: petite-maison-backend-secret
          env:
            - name: DATABASE_URL
              value: "file:/data/dev.db"
            - name: UPLOAD_DIR
              value: "/data/uploads"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: petite-maison-backend
  namespace: petite-maison
spec:
  selector:
    app: petite-maison-backend
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petite-maison-frontend
  namespace: petite-maison
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petite-maison-frontend
  template:
    metadata:
      labels:
        app: petite-maison-frontend
    spec:
      serviceAccountName: petite-maison-frontend
      containers:
        - name: frontend
          image: petite-maison-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Client-side API base (baked at build time for Next.js) - keep it stable for ingress routing.
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"
            # Server-side proxy routes use this first (works inside the cluster).
            - name: BACKEND_URL
              value: "http://petite-maison-backend/api/v1"
          readinessProbe:
            httpGet:
              path: /fr
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /fr
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: petite-maison-frontend
  namespace: petite-maison
spec:
  selector:
    app: petite-maison-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petite-maison
  namespace: petite-maison
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Backend API (do NOT use /api/ here because Next.js uses /api/* too)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: petite-maison-backend
                port:
                  number: 80
          # Backend uploads
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: petite-maison-backend
                port:
                  number: 80
          # Everything else -> Next.js
          - path: /
            pathType: Prefix
            backend:
              service:
                name: petite-maison-frontend
                port:
                  number: 80
