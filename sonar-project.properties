sonar.projectKey=bamekakenang_petite-maison
sonar.organization=bamekakenang
sonar.projectName=La Petite Maison de l'Épouvante

# Sources
sonar.sources=backend/src,apps/frontend/app,apps/frontend/components,apps/frontend/lib
sonar.tests=backend/src
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/prisma/migrations/**,**/logs/**,**/uploads/**

# TypeScript / JavaScript
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
