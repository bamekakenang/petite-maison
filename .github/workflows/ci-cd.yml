name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
env:
  ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL || '' }}
  LOAD_TEST_TARGET_URL: ${{ secrets.LOAD_TEST_TARGET_URL || '' }}

jobs:
  lint-backend:
    name: Backend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Debug workspace
        working-directory: ./backend
        run: |
          pwd
          ls -la
          ls -la package.json package-lock.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: TypeScript Check
        working-directory: ./backend
        run: npx tsc --noEmit

  lint-frontend:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Debug workspace
        working-directory: ./apps/frontend
        run: |
          pwd
          ls -la
          ls -la package.json package-lock.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: TypeScript Check
        working-directory: ./apps/frontend
        run: npx tsc --noEmit

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v3

      - name: Debug workspace
        working-directory: ./backend
        run: |
          pwd
          ls -la
          ls -la package.json package-lock.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Run tests with coverage
        working-directory: ./backend
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Check coverage threshold
        working-directory: ./backend
        run: |
          node -e "const c=require('./coverage/coverage-summary.json')?.total?.lines?.pct; if (typeof c !== 'number') { console.error('Unable to read coverage'); process.exit(1); } if (c < 70) { console.error('Coverage is below 70%: ' + c + '%'); process.exit(1); } console.log('Coverage OK: ' + c + '%');"

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run tests with coverage
        working-directory: ./apps/frontend
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Run tests with coverage
        working-directory: ./backend
        run: npm test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  security-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Debug workspace
        working-directory: ./backend
        run: |
          pwd
          ls -la
          ls -la package.json package-lock.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=critical || echo 'Audit found vulnerabilities (non-blocking)'

      - name: Run Snyk Security Scan
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  security-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Debug workspace
        working-directory: ./apps/frontend
        run: |
          pwd
          ls -la
          ls -la package.json package-lock.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run npm audit
        working-directory: ./apps/frontend
        run: npm audit --audit-level=critical || echo 'Audit found vulnerabilities (non-blocking)'

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    steps:
      - uses: actions/checkout@v3

      - name: Debug workspace
        working-directory: ./backend
        run: |
          pwd
          ls -la
          ls -la package.json package-lock.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Build
        working-directory: ./backend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-frontend]
    steps:
      - uses: actions/checkout@v3

      - name: Debug workspace
        working-directory: ./apps/frontend
        run: |
          pwd
          ls -la
          ls -la package.json package-lock.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Generate Prisma Client
        working-directory: ./apps/frontend
        run: npx prisma generate

      - name: Build
        working-directory: ./apps/frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/.next/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, security-backend, security-frontend]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.petitemaison.fr
    steps:
      - name: Deploy to staging
        run: echo "Deploying backend and frontend to staging environment..."
        # Add your deployment script here (e.g., Vercel, Railway, AWS)

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, security-backend, security-frontend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://petitemaison.fr
    steps:
      - name: Deploy to production
        run: echo "Deploying backend and frontend to production environment..."
        # Add your deployment script here (e.g., Vercel, Railway, AWS)
  zap-baseline:
    name: ZAP Baseline
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Skip ZAP if no target URL
        if: env.ZAP_TARGET_URL == ''
        run: echo "Skipping ZAP baseline — ZAP_TARGET_URL is not set."

      - name: Make workspace writable for ZAP container
        if: env.ZAP_TARGET_URL != ''
        run: chmod a+rwx "${GITHUB_WORKSPACE}"

      - name: Normalize ZAP target URL
        if: env.ZAP_TARGET_URL != ''
        run: |
          TARGET="${ZAP_TARGET_URL}"
          if [[ "${TARGET}" != http* ]]; then
            TARGET="https://${TARGET}"
          fi
          echo "ZAP_TARGET_URL=${TARGET}" >> "$GITHUB_ENV"

      - name: Run ZAP Baseline
        if: env.ZAP_TARGET_URL != ''
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ env.ZAP_TARGET_URL }}
          cmd_options: "-I"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  performance-test:
    name: Load Testing
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Artillery
        run: npm install -g artillery

      - name: Normalize load test target URL
        if: ${{ env.LOAD_TEST_TARGET_URL != '' }}
        run: |
          TARGET="${LOAD_TEST_TARGET_URL}"
          if [[ "${TARGET}" != http* ]]; then
            TARGET="https://${TARGET}"
          fi
          echo "LOAD_TEST_TARGET_URL=${TARGET}" >> "$GITHUB_ENV"

      - name: Skip load tests (no target)
        if: ${{ env.LOAD_TEST_TARGET_URL == '' }}
        run: 'echo "Skipping load tests: LOAD_TEST_TARGET_URL is not set."'

      - name: Run load tests (optional)
        if: ${{ env.LOAD_TEST_TARGET_URL != '' }}
        run: artillery run -t "$LOAD_TEST_TARGET_URL" backend/load-test.yml
